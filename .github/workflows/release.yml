name: Release

on:
  release:
    types: [published]
  # Publishes a release again (to Wally, and its models), as for a release whose first publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Check the versions match the tag
        run: |
          version="${TAG#v}"
          for manifest in lib/quarry-query/wally.toml lib/quarry-react-query/wally.toml; do
            grep -q "^version = \"$version\"$" "$manifest" || { echo "$manifest is not version $version"; exit 1; }
          done
          grep -q "^Query = \"quarry-luau/quarry-query@$version\"$" lib/quarry-react-query/wally.toml \
            || { echo "quarry-react-query does not depend on quarry-query $version"; exit 1; }

      - name: Install packages
        run: lune run install

      - name: Check
        run: lune run check

      - name: Attach the models to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/quarry-query.rbxm build/quarry-react-query.rbxm --clobber

      - name: Publish to Wally
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: |
          version="${TAG#v}"
          published() {
            curl -fsS -H "Wally-Version: 0.3.2" "https://api.wally.run/v1/package-metadata/quarry-luau/$1" 2>/dev/null \
              | grep -q "\"version\":\"$version\""
          }
          wally login --token "$WALLY_AUTH_TOKEN"
          for name in quarry-query quarry-react-query; do
            if published "$name"; then
              echo "quarry-luau/$name@$version is already on Wally"
              continue
            fi
            wally publish --project-path "lib/$name"
            # The index takes a moment to list a new version; quarry-react-query needs this quarry-query listed.
            for attempt in 1 2 3 4 5 6; do
              published "$name" && break
              sleep 10
            done
            published "$name" || { echo "quarry-luau/$name@$version is not on Wally after publishing"; exit 1; }
            echo "Published quarry-luau/$name@$version"
          done
