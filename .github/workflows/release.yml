name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Check the versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for manifest in lib/quarry/wally.toml lib/react-quarry/wally.toml; do
            grep -q "^version = \"$version\"$" "$manifest" || { echo "$manifest is not version $version"; exit 1; }
          done
          grep -q "^Quarry = \"quarry-luau/quarry@$version\"$" lib/react-quarry/wally.toml \
            || { echo "react-quarry does not depend on quarry $version"; exit 1; }

      - name: Install packages
        run: lune run install

      - name: Check
        run: lune run check

      - name: Attach the models to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/quarry.rbxm build/react-quarry.rbxm --clobber

      - name: Publish to Wally
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wally login --token "$WALLY_AUTH_TOKEN"
          for name in quarry react-quarry; do
            # A version already on Wally (published by hand) is left as it is.
            if curl -fsS -H "Wally-Version: 0.3.2" "https://api.wally.run/v1/package-metadata/quarry-luau/$name" \
              | grep -q "\"version\":\"$version\""; then
              echo "quarry-luau/$name@$version is already published"
              continue
            fi
            wally publish --project-path "lib/$name"
            # react-quarry depends on this quarry; give the index a moment to have it.
            sleep 20
          done
